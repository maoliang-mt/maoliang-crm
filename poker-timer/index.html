<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<title>RAISE · Blind Timer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --gold: #00c98b;
  --gold-bright: #00e39d;
  --bg-dark: #050807;
  --bg-card: rgba(7, 21, 16, 0.85);
  --text: #edfdf6;
  --text-dim: #6f9c8a;
  --green: #00c98b;
  --red: #ff4d5e;
  --orange: #ffa62b;
  --line: #104a38;
  --glow: rgba(0, 201, 139, 0.35);
}
body {
  font-family: 'PingFang SC','Helvetica Neue',sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  height: 100vh; width: 100vw;
  overflow: hidden;
  background-image: radial-gradient(ellipse at 50% 40%, rgba(0,201,139,0.13) 0%, transparent 70%);
}
.app::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 105px, rgba(0,201,139,0.03) 106px 107px);
  pointer-events: none;
  z-index: 1;
}

/* ========== 整体横屏布局 ========== */
/* 左侧盲注列表 | 右侧主区域（上：核心信息，下：进度+控制） */
.app {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ── 左侧：盲注结构列表 ── */
.sidebar {
  width: clamp(118px, 13vw, 300px);
  flex-shrink: 0;
  background: rgba(7,21,16,0.95);
  border-right: 1px solid var(--line);
  box-shadow: inset -12px 0 24px -12px rgba(0,201,139,0.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-head {
  padding: clamp(8px, 1.5vh, 24px) 14px clamp(6px, 1vh, 16px);
  font-size: clamp(9px, 1.4vh, 20px);
  color: var(--text-dim);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--line);
}
.sidebar-list {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(212,168,83,0.25) transparent;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.sidebar-list::-webkit-scrollbar { width:3px; }
.sidebar-list::-webkit-scrollbar-thumb { background:rgba(212,168,83,0.25);border-radius:2px; }
.sl-item {
  display: flex;
  align-items: center;
  padding: clamp(4px, 1.2vh, 20px) clamp(10px, 1.2vw, 24px);
  gap: clamp(6px, 0.8vw, 16px);
  border-left: 3px solid transparent;
  transition: all 0.15s;
  font-size: clamp(10px, 1.8vh, 26px);
  flex-shrink: 0;
}
.sl-item.past { opacity: 0.3; }
.sl-item.current {
  background: rgba(0,201,139,0.1);
  border-left-color: var(--gold);
  box-shadow: inset 0 0 18px rgba(0,201,139,0.12);
}
.sl-item.current .sl-val { color: var(--gold); font-weight: 500; }
.sl-item.future { opacity: 0.6; }
.sl-item.rest { background: rgba(0,201,139,0.04); }
.sl-item.rest.current { background: rgba(0,201,139,0.12); border-left-color: var(--green); }
.sl-idx { color: var(--text-dim); min-width: 16px; text-align: right; font-size: clamp(9px, 1.4vh, 22px); font-variant-numeric: tabular-nums; }
.sl-val { color: var(--text); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sl-ante { font-size: clamp(8px, 1.3vh, 20px); color: var(--gold-bright); opacity: 0.6; }

/* ── 右侧：主显示区 ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

/* 顶部品牌（极简小条） */
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 8px 0;
  flex-shrink: 0;
}
.brand .logo { font-size: clamp(14px, 2.2vh, 32px); color: var(--gold); }
.brand h1 { font-size: clamp(13px, 2.2vh, 34px); color: var(--gold); font-weight: 300; letter-spacing: 4px; text-shadow: 0 0 12px rgba(0,201,139,0.45); }
.brand .tag { font-size: clamp(9px, 1.3vh, 18px); color: var(--text-dim); letter-spacing: 3px; }

/* 核心信息区（横向：盲级 | 计时器 | 下一级） */
.core {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(20px, 3vw, 80px);
  padding: 0 clamp(16px, 2vw, 60px);
}

/* 当前盲级 */
.blind-block {
  text-align: center;
  flex: 1.2;
  min-width: 0;
}
.blind-label {
  font-size: clamp(9px, 1.8vh, 26px);
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.blind-val {
  font-size: min(clamp(36px, 11vh, 170px), 6.5vw);
  font-weight: 200;
  color: var(--text);
  line-height: 1;
  white-space: nowrap;
}
.blind-val .slash { color: var(--gold); margin: 0 clamp(4px, 0.8vw, 20px); }
.blind-ante {
  font-size: clamp(13px, 3vh, 50px);
  color: var(--gold-bright);
  margin-top: 6px;
  font-weight: 300;
  opacity: 0.85;
}
.blind-name {
  font-size: clamp(12px, 2.6vh, 42px);
  color: var(--gold);
  margin-top: 4px;
  font-weight: 300;
}
.rest-big-icon { font-size: clamp(44px, 8vh, 130px); line-height: 1.1; }
.rest-big-text { font-size: clamp(18px, 3.2vh, 56px); color: var(--gold); font-weight: 300; letter-spacing: 3px; margin-top: 6px; }

/* 圆环计时器 */
.timer-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}
.ring-wrap { position: relative; width: clamp(120px, 46vh, 520px); height: clamp(120px, 46vh, 520px); }
.ring-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring-bg { fill:none; stroke:rgba(0,201,139,0.04); stroke-width:1; transition: stroke 0.3s, opacity 0.3s; }
.ring-bg.warn { stroke:rgba(255,166,43,0.05); }
.ring-bg.danger { stroke:rgba(255,77,94,0.04); }
.ring-fg.danger { stroke: var(--red) !important; filter: drop-shadow(0 0 7px rgba(255,77,94,0.8)) !important; }
.ring-fg { fill:none; stroke:var(--gold); stroke-width:12; stroke-linecap:round; transition: stroke-dashoffset 1s linear, stroke 0.3s; filter: drop-shadow(0 0 8px rgba(0,201,139,0.9)); }
.ring-fg.warn { filter: drop-shadow(0 0 6px rgba(255,166,43,0.75)); }
.ring-fg.danger { filter: drop-shadow(0 0 7px rgba(255,77,94,0.8)); }
.ring-fg.warn { stroke: var(--orange); }
.ring-fg.danger { stroke: var(--red); }
.ring-inner { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center; }
.ring-time { font-size:clamp(30px, 11vh, 170px); font-weight:200; font-variant-numeric:tabular-nums; }
.ring-time.warn { color:var(--orange); }
.ring-time.danger { color:var(--red); }
.ring-sub { font-size:clamp(8px, 1.2vh, 18px); color:var(--text-dim); letter-spacing:2px; margin-top:2px; }

/* 下一盲级 + 统计 */
.next-block {
  text-align: center;
  flex: 1;
  min-width: 0;
}
.next-label {
  font-size: clamp(9px, 1.8vh, 26px);
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.next-val {
  font-size: clamp(18px, 4vh, 64px);
  color: var(--gold);
  font-weight: 400;
  line-height: 1.3;
}
.stats-row {
  display: flex;
  gap: clamp(16px, 2.5vw, 40px);
  justify-content: center;
  margin-top: clamp(10px, 2vh, 30px);
}
.stat { text-align: center; }
.stat-label { font-size: clamp(8px, 1.6vh, 22px); color: var(--text-dim); letter-spacing: 1px; }
.stat-val { font-size: clamp(14px, 3vh, 44px); color: var(--text); font-weight: 300; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* ── 底部：进度条 + 控制按钮 ── */
.bottom {
  flex-shrink: 0;
  padding: 0 clamp(16px, 2vw, 60px) clamp(8px, 1.5vh, 28px);
}
.progress-wrap {
  height: clamp(3px, 0.5vh, 8px);
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  margin-bottom: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--gold);
  transition: width 1s linear, background 0.3s;
  width: 0;
}
.progress-fill.warn { background: var(--orange); }
.progress-fill.danger { background: var(--red); }

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.btn {
  padding: clamp(6px, 1.1vh, 16px) clamp(16px, 2.4vw, 40px);
  border: none;
  border-radius: 6px;
  font-size: clamp(11px, 1.6vh, 22px);
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 1px;
  transition: all 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-go { background: var(--gold); color: #04120c; font-weight: bold; box-shadow: 0 0 14px rgba(0,201,139,0.5); }
.btn-sec { background: rgba(0,201,139,0.08); color: var(--text); border: 1px solid var(--line); }
.btn-set { background: rgba(0,201,139,0.08); color: #a4dccc; border: 1px solid var(--line); }

/* 全屏按钮 */
.fs-btn {
  position: absolute; top: 8px; right: 8px;
  width: 30px; height: 30px;
  border-radius: 6px; border: none;
  background: rgba(0,201,139,0.08);
  color: var(--text-dim); cursor: pointer; font-size: 14px;
  z-index: 50;
  border: 1px solid var(--line);
}
.fs-btn:hover { background: rgba(0,201,139,0.15); color: var(--gold); }

/* ========== 设置面板 ========== */
.settings-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
}
.settings-overlay.open { display: flex; }
.settings-box {
  background: rgba(7,21,16,0.98);
  border: 1px solid var(--line);
  border-radius: 16px;
  width: 90vw; max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,201,139,0.2) transparent;
  box-shadow: 0 0 40px rgba(0,201,139,0.12);
}
.settings-box::-webkit-scrollbar { width:4px; }
.settings-box::-webkit-scrollbar-thumb { background:rgba(212,168,83,0.2);border-radius:2px; }
.settings-box h2 { font-size:16px; color:var(--gold); font-weight:400; margin-bottom:16px; letter-spacing:2px; }
.s-item { margin-bottom:14px; }
.s-item label { display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px; letter-spacing:1px; }
.s-item input,.s-item select { width:100%; padding:8px 12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:var(--text); font-size:14px; font-family:inherit; }
.s-item input:focus,.s-item select:focus { outline:none; border-color:var(--gold); }

/* 方案管理 */
.scheme-sec { background:rgba(212,168,83,0.04); border:1px solid rgba(212,168,83,0.12); border-radius:10px; padding:14px; margin-bottom:18px; }
.scheme-sec h3 { font-size:13px; color:var(--gold); font-weight:400; margin-bottom:10px; }
.scheme-row { display:flex; gap:6px; margin-bottom:8px; }
.scheme-row input { flex:1; padding:6px 10px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:var(--text); font-size:13px; font-family:inherit; }
.scheme-row input:focus { outline:none; border-color:var(--gold); }
.scheme-row button,.scheme-load button { padding:6px 12px; border:none; border-radius:5px; font-size:12px; cursor:pointer; font-family:inherit; white-space:nowrap; }
.scheme-load { display:flex; gap:6px; }
.scheme-load select { flex:1; padding:6px 10px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:var(--text); font-size:13px; font-family:inherit; }
.scheme-load select:focus { outline:none; border-color:var(--gold); }

/* 休息设置 */
.rest-sec { background:rgba(92,138,92,0.06); border:1px solid rgba(92,138,92,0.15); border-radius:10px; padding:14px; margin-bottom:18px; }
.rest-sec h3 { font-size:13px; color:var(--green); font-weight:400; margin-bottom:10px; }
.rest-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.rest-row label { font-size:12px; color:var(--text-dim); white-space:nowrap; }
.rest-row input { width:50px; padding:5px 8px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:var(--text); font-size:13px; text-align:center; }
.rest-row input:focus { outline:none; border-color:var(--gold); }

/* 盲级编辑表 */
.lv-head { display:grid; grid-template-columns:1fr 1fr 1fr 60px 28px 24px; gap:4px; margin-bottom:4px; }
.lv-head span { font-size:10px; color:var(--text-dim); letter-spacing:1px; }
.lv-row { display:grid; grid-template-columns:1fr 1fr 1fr 60px 28px 24px; gap:4px; margin-bottom:6px; align-items:center; }
.lv-row input { padding:6px 6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:5px; color:var(--text); font-size:13px; min-width:0; }
.lv-row input:focus { outline:none; border-color:var(--gold); }
.lv-row.rest-hl input { border-color:rgba(92,138,92,0.3); background:rgba(92,138,92,0.06); }
.lv-row .chk { display:flex; align-items:center; justify-content:center; }
.lv-row .chk input[type=checkbox] { width:16px; height:16px; accent-color:var(--green); cursor:pointer; }
.lv-row .del { width:24px; height:24px; border-radius:5px; border:none; background:rgba(138,60,60,0.2); color:#c85c5c; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; }
.add-row { display:flex; gap:6px; margin-top:8px; }
.add-btn { flex:1; padding:8px; border-radius:6px; font-size:12px; cursor:pointer; font-family:inherit; border-style:dashed; border-width:1px; }
.add-lv { background:rgba(212,168,83,0.06); border-color:rgba(212,168,83,0.25); color:var(--gold); }
.add-rs { background:rgba(92,138,92,0.06); border-color:rgba(92,138,92,0.25); color:var(--green); }
.s-actions { display:flex; gap:8px; margin-top:20px; }
.s-actions button { flex:1; padding:10px; border:none; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; }
.s-save { background:var(--gold); color:#000; }
.s-cancel { background:rgba(255,255,255,0.08); color:var(--text); }

/* ========== 响应式：竖屏手机（宽<600） ========== */
@media (max-width:600px) {
  .app { flex-direction: column; }
  .sidebar { width:100%; height:auto; max-height:80px; border-right:none; border-bottom:1px solid rgba(255,255,255,0.06); }
  .sidebar-head { display:none; }
  .sidebar-list { display:flex; overflow-x:auto; overflow-y:hidden; }
  .sl-item { flex-shrink:0; border-left:none; border-bottom:2px solid transparent; padding:4px 10px; }
  .sl-item.current { border-bottom-color:var(--gold); border-left-color:transparent; }
  .sl-item.rest.current { border-bottom-color:var(--green); }
  .core { flex-direction:column; gap:16px; padding:0 16px; }
  .blind-val { font-size:36px; }
  .ring-wrap { width:120px; height:120px; }
  .ring-time { font-size:30px; }
  .next-val { font-size:18px; }
  .brand h1 { font-size:14px; }
  .bottom { padding:0 16px 8px; }
}

/* 横屏手机（高<500且宽>高）—— 比例优化 */
@media (max-height:500px) and (orientation:landscape) {
  /* 品牌条极简，不抢空间 */
  .brand { padding:3px 0; gap:6px; }
  .brand h1 { font-size:12px; letter-spacing:3px; }
  .brand .logo { font-size:12px; }
  .brand .tag { display:none; }

  /* 侧栏收窄：内容少，不需要 160px */
  .sidebar { width:118px; }
  .sidebar-head { padding:6px 8px 5px; font-size:9px; letter-spacing:2px; }
  .sl-item { padding:3px 8px; font-size:10px; gap:5px; }
  .sl-idx { font-size:9px; min-width:12px; }
  .sl-ante { font-size:8px; }
  .btn { padding:5px 14px; font-size:11px; }

  /* 核心区：充满高度，三区块按 1 : 1.25 : 1 分配 */
  .core { gap:14px; padding:0 14px; align-items:stretch; }
  .blind-block, .next-block {
    max-width:none; flex:1 1 0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .timer-block { flex:1.25 1 0; justify-content:center; }

  /* 当前盲级：放大作为主体信息 */
  .blind-label { margin-bottom:2px; }
  .blind-val { font-size:min(clamp(28px, 12vh, 58px), 6.2vw); }
  .blind-ante { margin-top:2px; }
  .blind-name { margin-top:1px; }
  .rest-big-text { margin-top:2px; }

  /* 计时器：放大为视觉焦点，随视口高度自适应 */
  .ring-wrap { width:min(240px, 62vh); height:min(240px, 62vh); }
  .ring-time { font-size:clamp(34px, 11vh, 52px); }
  .ring-sub { font-size:8px; }

  /* 下一盲级 + 统计 */
  .next-label { margin-bottom:2px; }
  .next-val { font-size:clamp(17px, 5vh, 24px); line-height:1.25; }
  .stats-row { gap:16px; margin-top:10px; }

  /* 底部紧凑 */
  .bottom { padding:0 14px 5px; }
  .progress-wrap { margin-bottom:5px; height:3px; }
  .controls { gap:8px; }
  .fs-btn { width:24px; height:24px; font-size:11px; top:4px; right:4px; }

  /* 侧栏列表垂直居中，与主区视觉对齐（内容不溢出时） */
  .sidebar-list { display:flex; flex-direction:column; justify-content:center; }
  .sl-item { flex-shrink:0; }
}
</style>
</head>
<body>
<!-- iOS 全屏提示 -->
<div id="fsTip" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;" onclick="hideTip()">
  <div style="text-align:center;padding:24px;max-width:320px;">
    <div style="font-size:40px;margin-bottom:12px;">📱</div>
    <div style="font-size:16px;color:#f5f5f5;margin-bottom:8px;">全屏使用方式</div>
    <div style="font-size:13px;color:#aaa;line-height:1.6;">
      <b>iPhone Safari</b>：点底部 <span style="font-size:18px;">⬆</span> 分享按钮 → 「添加到主屏幕」→ 从主屏幕打开即全屏<br><br>
      <b>Android Chrome</b>：点右上角 ⋮ → 「添加到主屏幕」<br><br>
      <b>电脑浏览器</b>：按 <span style="color:#d4a853;">F</span> 键即可全屏
    </div>
    <div style="font-size:11px;color:#666;margin-top:12px;">点击任意处关闭</div>
  </div>
</div>

<div class="app">
  <!-- 左侧盲注列表 -->
  <div class="sidebar">
    <div class="sidebar-head">盲注结构</div>
    <div class="sidebar-list" id="sidebarList"></div>
  </div>

  <!-- 右侧主区域 -->
  <div class="main">
    <button class="fs-btn" onclick="toggleFS()" title="全屏">⛶</button>

    <div class="brand">
      <span class="logo">♠</span>
      <h1>RAISE高手</h1>
      <span class="tag">TOURNAMENT CLOCK · LIVE</span>
    </div>

    <!-- 核心信息：盲级 | 计时器 | 下一级 -->
    <div class="core">
      <div class="blind-block">
        <div class="blind-label" id="bLabel">当前盲级</div>
        <div class="blind-val" id="bVal">50 <span class="slash">/</span> 100</div>
        <div class="blind-ante" id="bAnte"></div>
        <div class="blind-name" id="bName">第 2 级</div>
      </div>

      <div class="timer-block">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="90"/>
            <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="90"
              stroke-dasharray="565.48" stroke-dashoffset="0"/>
          </svg>
          <div class="ring-inner">
            <div class="ring-time" id="rTime">05:00</div>
            <div class="ring-sub">MINUTES</div>
          </div>
        </div>
      </div>

      <div class="next-block">
        <div class="next-label">下一盲级</div>
        <div class="next-val" id="nVal">100 / 200</div>
        <div class="stats-row">
          <div class="stat">
            <div class="stat-label">已用时间</div>
            <div class="stat-val" id="sElapsed">00:00</div>
          </div>
          <div class="stat">
            <div class="stat-label">进度</div>
            <div class="stat-val" id="sLevel">1 / 8</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部进度条+控制 -->
    <div class="bottom">
      <div class="progress-wrap">
        <div class="progress-fill" id="pBar"></div>
      </div>
      <div class="controls">
        <button class="btn btn-go" id="goBtn" onclick="toggle()">▶ 开始</button>
        <button class="btn btn-sec" onclick="reset()">↺ 重置</button>
        <button class="btn btn-set" onclick="openSet()">⚙ 设置</button>
      </div>
    </div>
  </div>
</div>

<!-- 设置面板（居中弹窗） -->
<div class="settings-overlay" id="setOverlay" onclick="if(event.target===this)closeSet()">
  <div class="settings-box">
    <h2>⚙ 设置</h2>

    <!-- 方案管理 -->
    <div class="scheme-sec">
      <h3>📋 方案管理</h3>
      <div class="scheme-row">
        <input type="text" id="inSchName" placeholder="输入方案名称…">
        <button style="background:var(--gold);color:#000;" onclick="saveSch()">💾 保存</button>
      </div>
      <div class="scheme-load">
        <select id="selSch"><option value="">-- 选择方案 --</option></select>
        <button style="background:rgba(212,168,83,0.12);color:var(--gold);" onclick="loadSch()">📂 加载</button>
        <button style="background:rgba(138,60,60,0.15);color:#c85c5c;" onclick="delSch()">🗑</button>
      </div>
    </div>

    <div class="s-item">
      <label>每级时长（分钟）</label>
      <input type="number" id="inDur" value="5" min="1" max="60">
    </div>
    <div class="s-item">
      <label>警示变色（秒）</label>
      <input type="number" id="inWarn" value="60" min="10" max="300">
    </div>
    <div class="s-item">
      <label>危险变色（秒）</label>
      <input type="number" id="inDanger" value="30" min="5" max="120">
    </div>
    <div class="s-item">
      <label>音效</label>
      <select id="inSound"><option value="1">开启</option><option value="0">关闭</option></select>
    </div>

    <!-- 自动休息 -->
    <div class="rest-sec">
      <h3>☕ 自动休息</h3>
      <div class="rest-row">
        <label>每</label><input type="number" id="inRestN" value="0" min="0" max="20">
        <label>级后休息</label><input type="number" id="inRestMin" value="5" min="1" max="30">
        <label>分钟</label>
      </div>
      <div style="font-size:10px;color:var(--text-dim);margin-top:6px;">0=不自动插入。也可手动勾☕标记休息行。</div>
    </div>

    <h2 style="margin-top:20px">盲级结构</h2>
    <div class="lv-head">
      <span>小盲</span><span>大盲</span><span>Ante</span><span>名称</span><span title="休息">☕</span><span></span>
    </div>
    <div id="lvList"></div>
    <div class="add-row">
      <button class="add-btn add-lv" onclick="addLv()">+ 添加盲级</button>
      <button class="add-btn add-rs" onclick="addRest()">+ 添加休息</button>
    </div>

    <div class="s-actions">
      <button class="s-save" onclick="saveCfg()">保存</button>
      <button class="s-cancel" onclick="closeSet()">取消</button>
    </div>
  </div>
</div>

<script>
/* ===== State ===== */
var S = { idx:0, left:300, total:300, run:false, elapsed:0 };
var timer = null;

var blinds = [
  {s:10,b:20,a:0,n:'热身',r:false},
  {s:25,b:50,a:0,n:'1',r:false},
  {s:50,b:100,a:50,n:'2',r:false},
  {s:100,b:200,a:100,n:'3',r:false},
  {s:200,b:400,a:200,n:'4',r:false},
  {s:300,b:600,a:300,n:'5',r:false},
  {s:500,b:1000,a:500,n:'6',r:false},
  {s:1000,b:2000,a:1000,n:'Final',r:false}
];

var C = { dur:5, warn:60, danger:30, sound:true, restN:0, restMin:5 };

var RT = []; // runtime blinds

/* ===== Build Runtime ===== */
function buildRT() {
  RT = [];
  var pc = 0;
  for (var i=0; i<blinds.length; i++) {
    var lv = blinds[i];
    if (lv.r) { RT.push({s:0,b:0,a:0,n:'休息',r:true,_rm:C.restMin}); continue; }
    if (C.restN>0 && pc>0 && pc%C.restN===0) {
      RT.push({s:0,b:0,a:0,n:'休息',r:true,_rm:C.restMin});
    }
    RT.push({s:lv.s,b:lv.b,a:lv.a,n:lv.n,r:false,_rm:0});
    pc++;
  }
}

/* ===== Scheme Management ===== */
function getSch(){ try{return JSON.parse(localStorage.getItem('raiseSchemes')||'[]')}catch(e){return[]} }
function setSch(a){ localStorage.setItem('raiseSchemes',JSON.stringify(a)); }
function renderSchSel(){
  var s=getSch(),el=document.getElementById('selSch');
  el.innerHTML='<option value="">-- 选择方案 --</option>'+s.map(function(x,i){return'<option value="'+i+'">'+x.name+'</option>'}).join('');
}
function saveSch(){
  var name=document.getElementById('inSchName').value.trim();
  if(!name){alert('请输入方案名称');return;}
  readForm();
  var arr=getSch(),obj={name:name,blinds:JSON.parse(JSON.stringify(blinds)),dur:C.dur,warn:C.warn,danger:C.danger,restN:C.restN,restMin:C.restMin};
  var idx=arr.findIndex(function(x){return x.name===name});
  if(idx>=0)arr[idx]=obj;else arr.push(obj);
  setSch(arr);renderSchSel();document.getElementById('inSchName').value='';
  alert('方案「'+name+'」已保存');
}
function loadSch(){
  var sel=document.getElementById('selSch');
  if(sel.value===''){alert('请先选择方案');return;}
  var arr=getSch(),sc=arr[+sel.value];if(!sc)return;
  blinds=JSON.parse(JSON.stringify(sc.blinds));
  blinds.forEach(function(l){if(l.a===undefined)l.a=0;if(l.r===undefined)l.r=false;});
  C.dur=sc.dur||5;C.warn=sc.warn||60;C.danger=sc.danger||30;C.restN=sc.restN||0;C.restMin=sc.restMin||5;
  fillForm();renderLvs();
  alert('已加载方案「'+sc.name+'」，点保存应用');
}
function delSch(){
  var sel=document.getElementById('selSch');
  if(sel.value===''){alert('请先选择方案');return;}
  var arr=getSch(),nm=arr[+sel.value].name;
  if(!confirm('删除方案「'+nm+'」？'))return;
  arr.splice(+sel.value,1);setSch(arr);renderSchSel();
}

/* ===== Form <-> Config ===== */
function readForm(){
  C.dur=+document.getElementById('inDur').value||5;
  C.warn=+document.getElementById('inWarn').value||60;
  C.danger=+document.getElementById('inDanger').value||30;
  C.sound=document.getElementById('inSound').value==='1';
  C.restN=+document.getElementById('inRestN').value||0;
  C.restMin=+document.getElementById('inRestMin').value||5;
}
function fillForm(){
  document.getElementById('inDur').value=C.dur;
  document.getElementById('inWarn').value=C.warn;
  document.getElementById('inDanger').value=C.danger;
  document.getElementById('inSound').value=C.sound?'1':'0';
  document.getElementById('inRestN').value=C.restN;
  document.getElementById('inRestMin').value=C.restMin;
}

/* ===== Load / Save localStorage ===== */
function loadAll(){
  try{var s=JSON.parse(localStorage.getItem('raiseTimer'));if(s){Object.assign(C,s);if(C.restN===undefined)C.restN=0;if(C.restMin===undefined)C.restMin=5;}}catch(e){}
  try{var b=JSON.parse(localStorage.getItem('raiseBlinds'));if(b){blinds=b;blinds.forEach(function(l){if(l.a===undefined)l.a=0;if(l.r===undefined)l.r=false;});}}catch(e){}
  fillForm();
  S.total=C.dur*60;S.left=S.total;
  renderLvs();renderSchSel();buildRT();draw();
}

/* ===== Level list render ===== */
function renderLvs(){
  var h='';
  for(var i=0;i<blinds.length;i++){
    var l=blinds[i],cls=l.r?' rest-hl':'';
    h+='<div class="lv-row'+cls+'">';
    h+='<input type="number" value="'+l.s+'" onchange="blinds['+i+'].s=+this.value" placeholder="小盲">';
    h+='<input type="number" value="'+l.b+'" onchange="blinds['+i+'].b=+this.value" placeholder="大盲">';
    h+='<input type="number" value="'+l.a+'" onchange="blinds['+i+'].a=+this.value" placeholder="Ante">';
    h+='<input type="text" value="'+l.n+'" onchange="blinds['+i+'].n=this.value" placeholder="名称">';
    h+='<div class="chk"><input type="checkbox" '+(l.r?'checked':'')+' onchange="blinds['+i+'].r=this.checked;renderLvs()"></div>';
    h+='<button class="del" onclick="blinds.splice('+i+',1);renderLvs()" '+(blinds.length<=1?'disabled':'')+'>×</button>';
    h+='</div>';
  }
  document.getElementById('lvList').innerHTML=h;
}
function addLv(){
  var last=blinds[blinds.length-1];
  blinds.push({s:last.s*2,b:last.b*2,a:last.a*2,n:String(blinds.length+1),r:false});
  renderLvs();
}
function addRest(){
  blinds.push({s:0,b:0,a:0,n:'休息',r:true});
  renderLvs();
}

/* ===== Save Settings ===== */
function saveCfg(){
  readForm();
  localStorage.setItem('raiseTimer',JSON.stringify(C));
  localStorage.setItem('raiseBlinds',JSON.stringify(blinds));
  S.total=C.dur*60;S.left=S.total;S.idx=0;S.elapsed=0;S.run=false;
  clearInterval(timer);
  document.getElementById('goBtn').textContent='▶ 开始';
  buildRT();draw();closeSet();
}

/* ===== Timer Control ===== */
function toggle(){
  if(S.run){
    clearInterval(timer);S.run=false;
    document.getElementById('goBtn').textContent='▶ 继续';
  }else{
    timer=setInterval(function(){
      S.left--;S.elapsed++;
      if(S.left===C.warn&&C.sound)beep(800,0.2);
      if(S.left===C.danger&&C.sound)beep(1000,0.3);
      if(S.left<=0){if(C.sound)beep(600,0.5);goNext();}
      draw();
    },1000);
    S.run=true;
    document.getElementById('goBtn').textContent='⏸ 暂停';
  }
}
function goNext(){
  if(S.idx<RT.length-1)S.idx++;
  var lv=RT[S.idx];
  S.total=(lv&&lv.r)?(lv._rm||C.restMin)*60:C.dur*60;
  S.left=S.total;
  if(!S.run)document.getElementById('goBtn').textContent='▶ 开始';
  draw();
}
function reset(){
  clearInterval(timer);S.run=false;S.idx=0;S.elapsed=0;
  var lv=RT[0];
  S.total=(lv&&lv.r)?(lv._rm||C.restMin)*60:C.dur*60;
  S.left=S.total;
  document.getElementById('goBtn').textContent='▶ 开始';
  draw();
}

/* ===== Draw / Update Display ===== */
function draw(){
  if(RT.length===0)buildRT();
  var lv=RT[S.idx]||RT[0];
  // blind block
  var bl=document.getElementById('bLabel'),bv=document.getElementById('bVal'),ba=document.getElementById('bAnte'),bn=document.getElementById('bName');
  if(lv.r){
    bl.textContent='休息时间';
    bv.innerHTML='<span class="rest-big-icon">☕</span>';
    ba.textContent='';bn.innerHTML='<span class="rest-big-text">REST BREAK</span>';
  }else{
    bl.textContent='当前盲级';
    bv.innerHTML=lv.s+' <span class="slash">/</span> '+lv.b;
    ba.textContent=lv.a>0?'Ante '+lv.a:'';
    bn.textContent=/^\d+$/.test(String(lv.n))?('第 '+lv.n+' 级'):lv.n;
  }
  // timer
  var mm=String(Math.floor(S.left/60)).padStart(2,'0'),ss=String(S.left%60).padStart(2,'0');
  var tEl=document.getElementById('rTime');tEl.textContent=mm+':'+ss;
  var ring=document.getElementById('ringFg');
  ring.classList.remove('warn','danger');tEl.classList.remove('warn','danger');
  ring.style.stroke='';
  if(S.left<=C.danger){ring.classList.add('danger');tEl.classList.add('danger');}
  else if(S.left<=C.warn){ring.classList.add('warn');tEl.classList.add('warn');}
  var pct=S.total>0?S.left/S.total:0;
  ring.setAttribute('stroke-dashoffset',565.48*(1-pct));
  // progress bar
  var bar=document.getElementById('pBar');
  var used=S.total>0?((S.total-S.left)/S.total*100):0;
  bar.style.width=used+'%';
  bar.classList.remove('warn','danger');
  if(S.left<=C.danger)bar.classList.add('danger');
  else if(S.left<=C.warn)bar.classList.add('warn');
  // elapsed
  document.getElementById('sElapsed').textContent=String(Math.floor(S.elapsed/60)).padStart(2,'0')+':'+String(S.elapsed%60).padStart(2,'0');
  // level index
  document.getElementById('sLevel').textContent=(S.idx+1)+' / '+RT.length;
  // next blind
  var ni=S.idx+1,nEl=document.getElementById('nVal');
  if(ni<RT.length){
    var nx=RT[ni];
    if(nx.r){nEl.textContent='☕ 休息 '+(nx._rm||C.restMin)+'分钟';}
    else{var t=nx.s+' / '+nx.b;if(nx.a>0)t+=' · Ante '+nx.a;nEl.textContent=t;}
  }else{nEl.textContent='— 最后一级 —';}
  // sidebar
  renderSB();
}

/* ===== Sidebar ===== */
function renderSB(){
  var sb=document.getElementById('sidebarList'),h='';
  for(var i=0;i<RT.length;i++){
    var lv=RT[i],cls='sl-item';
    if(i<S.idx)cls+=' past';else if(i===S.idx)cls+=' current';else cls+=' future';
    if(lv.r)cls+=' rest';
    h+='<div class="'+cls+'">';
    h+='<span class="sl-idx">'+(i+1)+'</span>';
    if(lv.r){h+='<span class="sl-val" style="color:var(--green)">☕ '+(lv._rm||C.restMin)+'min</span>';}
    else{
      h+='<span class="sl-val">'+lv.s+'/'+lv.b+'</span>';
      if(lv.a>0)h+='<span class="sl-ante">A'+lv.a+'</span>';
    }
    h+='</div>';
  }
  sb.innerHTML=h;
  var cur=sb.querySelector('.sl-item.current');
  if(cur){
    var top=cur.offsetTop-(sb.clientHeight/2)+(cur.offsetHeight/2);
    sb.scrollTo({top:top<0?0:top,behavior:'smooth'});
  }
}

/* ===== Utils ===== */
function beep(f,d){
  try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=0.3;o.start();o.stop(c.currentTime+d);}catch(e){}
}
function openSet(){document.getElementById('setOverlay').classList.add('open');}
function closeSet(){document.getElementById('setOverlay').classList.remove('open');}
function toggleFS(){
  // 优先用 Fullscreen API
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    return;
  }
  var el=document.documentElement;
  var rfs=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(rfs){rfs.call(el);return;}
  // iOS 不支持 fullscreen API，提示添加主屏幕
  showTip();
}
var tipTimer=null;
function showTip(){
  var t=document.getElementById('fsTip');
  t.style.display='flex';
  clearTimeout(tipTimer);
  tipTimer=setTimeout(function(){t.style.display='none';},5000);
}
function hideTip(){document.getElementById('fsTip').style.display='none';clearTimeout(tipTimer);}

/* Keyboard */
document.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.code==='KeyR'){e.preventDefault();reset();}
  if(e.code==='KeyF'){e.preventDefault();toggleFS();}
  if(e.code==='Escape')closeSet();
});

/* ===== Init ===== */
loadAll();
</script>
</body>
</html>
