<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAISE · Blind Timer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #F5D023;
  --gold-bright: #F9E45A;
  --green: #6BBF4E;
  --bg-dark: #0A0E14;
  --bg-card: rgba(13, 40, 24, 0.6);
  --text: #f5f5f5;
  --text-dim: #888;
  --red: #E74C3C;
  --orange: #F39C12;
}

body {
  font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
  background-image: radial-gradient(ellipse at center, rgba(13,40,24,0.3) 0%, transparent 70%);
}

.display-mode {
  display: flex; flex-direction: row; align-items: stretch;
  min-height: 100vh; padding: 0;
}

/* 盲注结构竖列总览 */
.blinds-sidebar {
  width: 220px;
  min-width: 180px;
  background: rgba(20, 20, 20, 0.95);
  border-right: 1px solid rgba(255,255,255,0.06);
  overflow-y: auto;
  padding: 20px 0;
  flex-shrink: 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(212,168,83,0.3) transparent;
}
.blinds-sidebar::-webkit-scrollbar { width: 4px; }
.blinds-sidebar::-webkit-scrollbar-track { background: transparent; }
.blinds-sidebar::-webkit-scrollbar-thumb { background: rgba(212,168,83,0.3); border-radius: 2px; }
.sidebar-title {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: center;
  padding: 8px 12px 16px;
}
.sidebar-level {
  display: flex;
  align-items: center;
  padding: 8px 16px;
  gap: 10px;
  cursor: default;
  transition: all 0.2s;
  border-left: 3px solid transparent;
  position: relative;
}
.sidebar-level.past {
  opacity: 0.35;
}
.sidebar-level.current {
  background: rgba(245, 208, 35, 0.1);
  border-left-color: var(--gold);
}
.sidebar-level.current .sl-blinds { color: var(--gold); font-weight: 500; }
.sidebar-level.future { opacity: 0.7; }
.sidebar-level.rest-break {
  background: rgba(92, 138, 92, 0.06);
}
.sidebar-level.rest-break.current {
  background: rgba(92, 138, 92, 0.15);
  border-left-color: var(--green);
}
.sl-idx {
  font-size: 11px;
  color: var(--text-dim);
  min-width: 20px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.sl-blinds {
  font-size: 14px;
  color: var(--text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sl-ante {
  font-size: 10px;
  color: var(--gold-bright);
  opacity: 0.7;
}
.sl-rest-icon {
  font-size: 14px;
}

/* 主内容区 */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 40px 140px;
  min-width: 0;
}

/* 品牌条 */
.brand-bar { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:80px; }
.brand-bar .logo { width:56px;height:56px;border:2px solid var(--gold);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px; }
.brand-bar h1 { font-size:42px;color:var(--gold);font-weight:300;letter-spacing:6px; }
.brand-bar .tagline { font-size:14px;color:var(--text-dim);letter-spacing:4px;margin-top:4px; }

/* 中央区域 */
.center-stage { display:flex; align-items:stretch; gap:60px; margin-bottom:40px; }

/* 盲级卡 */
.blind-card { background:linear-gradient(135deg, rgba(13,40,24,0.7) 0%, rgba(10,14,20,0.9) 100%);backdrop-filter:blur(12px);border:1px solid rgba(107,191,78,0.2);border-radius:20px;padding:50px 60px;text-align:center;min-width:320px;box-shadow:0 0 30px rgba(107,191,78,0.05); }
.blind-card .card-label { font-size:14px;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px; }
.blind-card .level-number { font-size:96px;font-weight:200;color:var(--text);line-height:1;letter-spacing:-2px; }
.blind-card .level-number .slash { color:var(--gold);margin:0 8px; }
.blind-card .level-name { font-size:22px;color:var(--gold);margin-top:16px;font-weight:300; }
.blind-card .ante-display { font-size:20px;color:var(--gold-bright);margin-top:10px;font-weight:300;opacity:0.85;letter-spacing:1px; }
.blind-card .rest-icon { font-size:80px;line-height:1.1; }
.blind-card .rest-label { font-size:36px;color:var(--gold);font-weight:300;letter-spacing:4px;margin-top:12px; }

/* 计时器环 */
.timer-ring-container { display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg, rgba(13,40,24,0.7) 0%, rgba(10,14,20,0.9) 100%);backdrop-filter:blur(12px);border:1px solid rgba(107,191,78,0.2);border-radius:20px;padding:50px 60px;min-width:320px;box-shadow:0 0 30px rgba(107,191,78,0.05); }
.timer-ring-container .card-label { font-size:14px;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:20px; }
.ring-wrapper { position:relative;width:200px;height:200px; }
.ring-svg { transform:rotate(-90deg);width:100%;height:100%; }
.ring-bg { fill:none;stroke:rgba(255,255,255,0.06);stroke-width:6; }
.ring-progress { fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke 0.3s; }
.ring-progress.warning { stroke:var(--orange); }
.ring-progress.danger { stroke:var(--red); }
.ring-text { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center; }
.ring-time { font-size:48px;font-weight:200;color:var(--text);font-variant-numeric:tabular-nums; }
.ring-time.warning { color:var(--orange); }
.ring-time.danger { color:var(--red); }
.ring-min-label { font-size:12px;color:var(--text-dim);letter-spacing:2px;margin-top:4px; }

/* 时间进度条 */
.progress-bar-wrapper { width:100%;max-width:800px;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;margin-bottom:20px;overflow:hidden; }
.progress-bar-fill { height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold));transition:width 1s linear,background 0.3s;width:0%; }
.progress-bar-fill.warning { background:linear-gradient(90deg,var(--gold),var(--orange)); }
.progress-bar-fill.danger { background:linear-gradient(90deg,var(--orange),var(--red)); }

/* 底部信息条 */
.bottom-bar { display:flex;gap:40px;background:linear-gradient(135deg, rgba(13,40,24,0.5) 0%, rgba(10,14,20,0.7) 100%);backdrop-filter:blur(12px);border:1px solid rgba(107,191,78,0.15);border-radius:16px;padding:24px 40px;align-items:center; }
.bottom-bar .info-item { display:flex;flex-direction:column;align-items:center;gap:6px; }
.bottom-bar .info-label { font-size:11px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase; }
.bottom-bar .info-value { font-size:24px;color:var(--text);font-weight:300; }
.bottom-bar .info-value.highlight { color:var(--gold);font-size:26px;font-weight:400; }
.bottom-bar .divider { width:1px;height:40px;background:rgba(255,255,255,0.1); }

/* 控制栏 */
.controls { position:fixed;bottom:0;left:0;right:0;padding:20px 40px;background:rgba(15,15,15,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:center;gap:12px;z-index:100; }
.btn { padding:12px 24px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;font-family:inherit;letter-spacing:1px;display:flex;align-items:center;gap:8px; }
.btn:hover { transform:translateY(-1px); }
.btn:active { transform:translateY(0); }
.btn-primary { background:var(--gold);color:#000; }
.btn-primary:hover { background:var(--gold-bright); }
.btn-secondary { background:rgba(255,255,255,0.08);color:var(--text); }
.btn-secondary:hover { background:rgba(255,255,255,0.12); }
.btn-danger { background:rgba(138,60,60,0.3);color:#c85c5c; }
.btn-danger:hover { background:rgba(138,60,60,0.5); }

/* 设置面板 */
.settings-panel { position:fixed;top:0;right:-480px;width:480px;height:100vh;background:rgba(15,15,15,0.97);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,0.06);padding:32px;transition:right 0.3s ease;z-index:200;overflow-y:auto; }
.settings-panel.open { right:0; }
.settings-panel h2 { font-size:20px;color:var(--gold);font-weight:400;margin-bottom:24px;letter-spacing:2px; }
.setting-item { margin-bottom:20px; }
.setting-item label { display:block;font-size:12px;color:var(--text-dim);margin-bottom:8px;letter-spacing:1px; }
.setting-item input,.setting-item select { width:100%;padding:10px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--text);font-size:15px;font-family:inherit; }
.setting-item input:focus,.setting-item select:focus { outline:none;border-color:var(--gold); }

/* 方案管理 */
.scheme-section { background:rgba(212,168,83,0.05);border:1px solid rgba(212,168,83,0.15);border-radius:12px;padding:20px;margin-bottom:28px; }
.scheme-section h3 { font-size:15px;color:var(--gold);font-weight:400;margin-bottom:16px;letter-spacing:1px; }
.scheme-row { display:flex;gap:8px;margin-bottom:10px; }
.scheme-row input { flex:1;padding:8px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:14px;font-family:inherit; }
.scheme-row input:focus { outline:none;border-color:var(--gold); }
.scheme-row button,.scheme-load-row button { padding:8px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap; }
.scheme-load-row { display:flex;gap:8px; }
.scheme-load-row select { flex:1;padding:8px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:14px;font-family:inherit;appearance:auto; }
.scheme-load-row select:focus { outline:none;border-color:var(--gold); }

/* 自动休息 */
.rest-settings { background:rgba(92,138,92,0.08);border:1px solid rgba(92,138,92,0.2);border-radius:10px;padding:16px;margin-bottom:20px; }
.rest-settings h3 { font-size:14px;color:var(--green);font-weight:400;margin-bottom:12px; }
.rest-settings .rest-row { display:flex;gap:10px;align-items:center;flex-wrap:wrap; }
.rest-settings .rest-row label { font-size:13px;color:var(--text-dim);white-space:nowrap; }
.rest-settings .rest-row input { width:60px;padding:6px 10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:14px;text-align:center; }
.rest-settings .rest-row input:focus { outline:none;border-color:var(--gold); }

/* 盲级列表 */
.levels-header { display:grid;grid-template-columns:1fr 1fr 1fr 70px 36px 30px;gap:6px;margin-bottom:6px;padding:0 2px; }
.levels-header span { font-size:11px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase; }
.levels-list { margin-top:8px; }
.level-row { display:grid;grid-template-columns:1fr 1fr 1fr 70px 36px 30px;gap:6px;margin-bottom:8px;align-items:center; }
.level-row input { padding:8px 8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text);font-size:14px;min-width:0; }
.level-row input:focus { outline:none;border-color:var(--gold); }
.level-row.rest-row-hl input { border-color:rgba(92,138,92,0.4);background:rgba(92,138,92,0.08); }
.level-row .rest-chk { display:flex;align-items:center;justify-content:center; }
.level-row .rest-chk input[type="checkbox"] { width:18px;height:18px;accent-color:var(--green);cursor:pointer; }
.level-row .del-btn { width:30px;height:30px;border-radius:6px;border:none;background:rgba(138,60,60,0.2);color:#c85c5c;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center; }

.add-level-row { display:flex;gap:8px;margin-top:8px; }
.add-level,.add-rest { flex:1;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;border-style:dashed;border-width:1px; }
.add-level { background:rgba(212,168,83,0.08);border-color:rgba(212,168,83,0.3);color:var(--gold); }
.add-level:hover { background:rgba(212,168,83,0.12); }
.add-rest { background:rgba(92,138,92,0.08);border-color:rgba(92,138,92,0.3);color:var(--green); }
.add-rest:hover { background:rgba(92,138,92,0.12); }

.settings-actions { display:flex;gap:10px;margin-top:30px; }
.btn-save { flex:1;padding:12px;background:var(--gold);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit; }
.btn-cancel { flex:1;padding:12px;background:rgba(255,255,255,0.08);color:var(--text);border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit; }

.fs-btn { position:fixed;top:20px;right:20px;width:40px;height:40px;border-radius:8px;border:none;background:rgba(255,255,255,0.08);color:var(--text-dim);cursor:pointer;font-size:16px;z-index:50;transition:all 0.2s; }
.fs-btn:hover { background:rgba(255,255,255,0.15);color:var(--text); }

@media (max-width:900px) {
  .display-mode { flex-direction: column; }
  .blinds-sidebar { width:100%;min-width:unset;max-height:120px;border-right:none;border-bottom:1px solid rgba(255,255,255,0.06);flex-direction:row;display:flex;overflow-x:auto;overflow-y:hidden;padding:8px 0; }
  .blinds-sidebar .sidebar-title { display:none; }
  .sidebar-level { padding:6px 12px;flex-shrink:0;border-left:none;border-bottom:3px solid transparent; }
  .sidebar-level.current { border-bottom-color:var(--gold);border-left-color:transparent; }
  .sidebar-level.rest-break.current { border-bottom-color:var(--green); }
  .sl-idx { font-size:10px;min-width:16px; }
  .sl-blinds { font-size:12px; }
  .main-content { padding:20px 20px 140px; }
  .center-stage { flex-direction:column;gap:30px; }
  .blind-card,.timer-ring-container { min-width:260px;padding:30px; }
  .brand-bar h1 { font-size:32px; }
  .brand-bar { margin-bottom:30px; }
  .controls { flex-wrap:wrap;padding:12px; }
  .btn { padding:10px 16px;font-size:12px; }
  .settings-panel { width:100%;right:-100%; }
  .settings-panel.open { right:0; }
}
.brand-cn { font-size: 28px; margin-left: 8px; color: var(--green); font-weight: 400; letter-spacing: 2px; }
.live-badge { display:flex;align-items:center;gap:8px;font-size:13px;color:var(--green);letter-spacing:2px;margin-left:auto;padding:6px 16px;border:1px solid rgba(107,191,78,0.3);border-radius:20px;background:rgba(107,191,78,0.08); }
.live-dot { width:8px;height:8px;border-radius:50%;background:var(--green);animation:livePulse 2s ease-in-out infinite; }
@keyframes livePulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

.level-flash {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, rgba(245,208,35,0.15) 0%, transparent 70%);
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  animation: flashPulse 0.8s ease-out forwards;
}
@keyframes flashPulse { 0%{opacity:1;} 100%{opacity:0;} }

body::before {
  content: '♠ ♥ ♦ ♣';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  font-size: 120px;
  color: rgba(255,255,255,0.015);
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 80px;
  pointer-events: none;
  z-index: 0;
}
</style>
</head>
<body>

<button class="fs-btn" onclick="toggleFullscreen()" title="全屏">⛶</button>

<div class="display-mode">
  <!-- 盲注结构竖列总览 -->
  <div class="blinds-sidebar" id="blindsSidebar">
    <div class="sidebar-title">盲注结构</div>
  </div>

  <!-- 主显示区 -->
  <div class="main-content">
  <div class="brand-bar">
    <div class="logo">♠</div>
    <div>
      <h1>RAISE<span class="brand-cn">高手</span></h1>
      <div class="tagline">POKER · BEER</div>
    </div>
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
  </div>

  <div class="center-stage">
    <div class="blind-card">
      <div class="card-label" id="blindCardLabel">当前盲级</div>
      <div class="level-number" id="blindDisplay">50 <span class="slash">/</span> 100</div>
      <div class="ante-display" id="anteDisplay"></div>
      <div class="level-name" id="levelName">第 3 级</div>
    </div>
    <div class="timer-ring-container">
      <div class="card-label">剩余时间</div>
      <div class="ring-wrapper">
        <svg class="ring-svg" viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="90"/>
          <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"
            stroke-dasharray="565.48" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-text">
          <div class="ring-time" id="timeDisplay">05:00</div>
          <div class="ring-min-label">MINUTES</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 时间进度条 -->
  <div class="progress-bar-wrapper">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="bottom-bar">
    <div class="info-item">
      <span class="info-label">下一盲级</span>
      <span class="info-value highlight" id="nextBlind">100 / 200</span>
    </div>
    <div class="divider"></div>
    <div class="info-item">
      <span class="info-label">已用时间</span>
      <span class="info-value" id="elapsed">00:00</span>
    </div>
    <div class="divider"></div>
    <div class="info-item">
      <span class="info-label">当前级别</span>
      <span class="info-value" id="levelIndex">3 / 8</span>
    </div>
  </div>
  </div><!-- /.main-content -->
</div>

<!-- 控制栏：暂停/重置/设置 -->
<div class="controls">
  <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">▶ 开始</button>
  <button class="btn btn-secondary" onclick="resetTimer()">↺ 重置</button>
  <button class="btn btn-danger" onclick="toggleSettings()">⚙ 设置</button>
</div>

<!-- 设置面板 -->
<div class="settings-panel" id="settingsPanel">
  <h2>⚙ 设置</h2>

  <!-- 方案管理 -->
  <div class="scheme-section">
    <h3>📋 方案管理</h3>
    <div class="scheme-row">
      <input type="text" id="schemeName" placeholder="输入方案名称…">
      <button style="background:var(--gold);color:#000;" onclick="saveScheme()">💾 保存</button>
    </div>
    <div class="scheme-load-row">
      <select id="schemeSelect"><option value="">-- 选择已保存方案 --</option></select>
      <button style="background:rgba(212,168,83,0.15);color:var(--gold);" onclick="loadScheme()">📂 加载</button>
      <button style="background:rgba(138,60,60,0.2);color:#c85c5c;" onclick="deleteScheme()">🗑</button>
    </div>
  </div>

  <div class="setting-item">
    <label>每级时长（分钟）</label>
    <input type="number" id="setDuration" value="5" min="1" max="60">
  </div>
  <div class="setting-item">
    <label>警示变色（秒）</label>
    <input type="number" id="setWarn" value="60" min="10" max="300">
  </div>
  <div class="setting-item">
    <label>危险变色（秒）</label>
    <input type="number" id="setDanger" value="30" min="5" max="120">
  </div>
  <div class="setting-item">
    <label>音效</label>
    <select id="setSound">
      <option value="1">开启</option>
      <option value="0">关闭</option>
    </select>
  </div>
  <div class="setting-item">
    <label>语音播报</label>
    <select id="setTTS">
      <option value="1">开启</option>
      <option value="0">关闭</option>
    </select>
  </div>

  <!-- 自动休息间隔 -->
  <div class="rest-settings">
    <h3>☕ 自动休息间隔</h3>
    <div class="rest-row">
      <label>每</label>
      <input type="number" id="setRestInterval" value="0" min="0" max="20">
      <label>个盲级后，休息</label>
      <input type="number" id="setRestDuration" value="5" min="1" max="30">
      <label>分钟</label>
    </div>
    <div style="font-size:11px;color:var(--text-dim);margin-top:8px;">
      设为 0 表示不自动插入休息。也可在盲级列表中手动勾选 ☕ 标记休息行。
    </div>
  </div>

  <h2 style="margin-top:30px">盲级结构</h2>
  <div class="levels-header">
    <span>小盲</span><span>大盲</span><span>Ante</span><span>名称</span><span title="休息">☕</span><span></span>
  </div>
  <div class="levels-list" id="levelsList"></div>
  <div class="add-level-row">
    <button class="add-level" onclick="addLevel()">+ 添加盲级</button>
    <button class="add-rest" onclick="addRestLevel()">+ 添加休息</button>
  </div>

  <div class="settings-actions">
    <button class="btn-save" onclick="saveSettings()">保存</button>
    <button class="btn-cancel" onclick="toggleSettings()">取消</button>
  </div>
</div>

<script>
/* ============================================================
   RAISE Blind Timer
   ============================================================ */

let state = { levelIdx: 0, timeLeft: 300, totalTime: 300, running: false, elapsed: 0 };
let interval = null;

/* 默认盲注结构 (s=小盲, b=大盲, a=ante, n=名称, r=休息标记) */
let blinds = [
  { s:10,   b:20,   a:0,    n:'热身',  r:false },
  { s:25,   b:50,   a:0,    n:'1',     r:false },
  { s:50,   b:100,  a:50,   n:'2',     r:false },
  { s:100,  b:200,  a:100,  n:'3',     r:false },
  { s:200,  b:400,  a:200,  n:'4',     r:false },
  { s:300,  b:600,  a:300,  n:'5',     r:false },
  { s:500,  b:1000, a:500,  n:'6',     r:false },
  { s:1000, b:2000, a:1000, n:'Final', r:false }
];

let cfg = { dur:5, warn:60, danger:30, sound:true, tts:true, restInterval:0, restDuration:5 };

/* ── 运行时盲级列表（含自动插入的休息轮） ── */
let runtimeBlinds = [];

/**
 * 将编辑列表(blinds) + 自动休息配置 → 生成 runtimeBlinds
 * 自动休息只插在非休息的盲级之间，手动标记的休息行原样保留
 */
function buildRuntime() {
  runtimeBlinds = [];
  let playedCount = 0; // 已经过的非休息盲级计数
  for (let i = 0; i < blinds.length; i++) {
    const lv = blinds[i];
    if (lv.r) {
      // 手动休息行：直接加入
      runtimeBlinds.push({ ...lv, _rest: true, _restMin: cfg.restDuration });
      continue;
    }
    // 自动休息：在第 N, 2N, 3N... 个非休息盲级之后插入（在下一个盲级之前）
    if (cfg.restInterval > 0 && playedCount > 0 && playedCount % cfg.restInterval === 0) {
      runtimeBlinds.push({ s:0, b:0, a:0, n:'休息', r:true, _rest:true, _restMin:cfg.restDuration });
    }
    runtimeBlinds.push({ ...lv, _rest: false });
    playedCount++;
  }
}

/* ── 方案管理 ── */
function getSchemes() {
  try { return JSON.parse(localStorage.getItem('raiseSchemes') || '[]'); }
  catch(e) { return []; }
}
function setSchemes(arr) { localStorage.setItem('raiseSchemes', JSON.stringify(arr)); }

function renderSchemeSelect() {
  const sel = document.getElementById('schemeSelect');
  const schemes = getSchemes();
  sel.innerHTML = '<option value="">-- 选择已保存方案 --</option>' +
    schemes.map((s,i) => '<option value="'+i+'">'+s.name+'</option>').join('');
}

/** 从设置面板 DOM 读取当前编辑的值到 cfg / blinds */
function readFormValues() {
  cfg.dur = +document.getElementById('setDuration').value || 5;
  cfg.warn = +document.getElementById('setWarn').value || 60;
  cfg.danger = +document.getElementById('setDanger').value || 30;
  cfg.sound = document.getElementById('setSound').value === '1';
  cfg.tts = document.getElementById('setTTS').value === '1';
  cfg.restInterval = +document.getElementById('setRestInterval').value || 0;
  cfg.restDuration = +document.getElementById('setRestDuration').value || 5;
  // blinds 已在 onchange 实时更新
}

function saveScheme() {
  var nameEl = document.getElementById('schemeName');
  var name = nameEl.value.trim();
  if (!name) { alert('请输入方案名称'); return; }
  readFormValues();
  var schemes = getSchemes();
  // 同名覆盖
  var idx = schemes.findIndex(function(s){ return s.name === name; });
  var scheme = { name:name, blinds:JSON.parse(JSON.stringify(blinds)), dur:cfg.dur, warn:cfg.warn, danger:cfg.danger, restInterval:cfg.restInterval, restDuration:cfg.restDuration };
  if (idx >= 0) { schemes[idx] = scheme; } else { schemes.push(scheme); }
  setSchemes(schemes);
  renderSchemeSelect();
  nameEl.value = '';
  alert('方案「' + name + '」已保存');
}

function loadScheme() {
  var sel = document.getElementById('schemeSelect');
  if (sel.value === '') { alert('请先选择一个方案'); return; }
  var schemes = getSchemes();
  var scheme = schemes[+sel.value];
  if (!scheme) return;
  blinds = JSON.parse(JSON.stringify(scheme.blinds));
  // 兼容旧方案没有 a/r 字段
  blinds.forEach(function(l){ if (l.a === undefined) l.a = 0; if (l.r === undefined) l.r = false; });
  cfg.dur = scheme.dur || 5;
  cfg.warn = scheme.warn || 60;
  cfg.danger = scheme.danger || 30;
  cfg.restInterval = scheme.restInterval || 0;
  cfg.restDuration = scheme.restDuration || 5;
  fillFormFromCfg();
  renderLevels();
  alert('已加载方案「' + scheme.name + '」，点击保存以应用');
}

function deleteScheme() {
  var sel = document.getElementById('schemeSelect');
  if (sel.value === '') { alert('请先选择要删除的方案'); return; }
  var schemes = getSchemes();
  var name = schemes[+sel.value].name;
  if (!confirm('确认删除方案「' + name + '」？')) return;
  schemes.splice(+sel.value, 1);
  setSchemes(schemes);
  renderSchemeSelect();
}

function fillFormFromCfg() {
  document.getElementById('setDuration').value = cfg.dur;
  document.getElementById('setWarn').value = cfg.warn;
  document.getElementById('setDanger').value = cfg.danger;
  document.getElementById('setSound').value = cfg.sound ? '1' : '0';
  document.getElementById('setTTS').value = cfg.tts ? '1' : '0';
  document.getElementById('setRestInterval').value = cfg.restInterval;
  document.getElementById('setRestDuration').value = cfg.restDuration;
}

/* ── 加载/保存 localStorage ── */
function load() {
  var s = localStorage.getItem('raiseTimer');
  if (s) {
    var parsed = JSON.parse(s);
    Object.assign(cfg, parsed);
    if (cfg.restInterval === undefined) cfg.restInterval = 0;
    if (cfg.restDuration === undefined) cfg.restDuration = 5;
    if (cfg.tts === undefined) cfg.tts = true;
  }
  var b = localStorage.getItem('raiseBlinds');
  if (b) {
    blinds = JSON.parse(b);
    blinds.forEach(function(l){ if (l.a === undefined) l.a = 0; if (l.r === undefined) l.r = false; });
  }
  fillFormFromCfg();
  state.totalTime = cfg.dur * 60;
  state.timeLeft = state.totalTime;
  renderLevels();
  renderSchemeSelect();
  buildRuntime();
  update();
}

/* ── 盲级列表渲染 ── */
function renderLevels() {
  var html = '';
  for (var i = 0; i < blinds.length; i++) {
    var l = blinds[i];
    var cls = l.r ? ' rest-row-hl' : '';
    html += '<div class="level-row' + cls + '" data-idx="' + i + '">' +
      '<input type="number" value="' + l.s + '" onchange="blinds[' + i + '].s=+this.value" placeholder="小盲">' +
      '<input type="number" value="' + l.b + '" onchange="blinds[' + i + '].b=+this.value" placeholder="大盲">' +
      '<input type="number" value="' + l.a + '" onchange="blinds[' + i + '].a=+this.value" placeholder="Ante">' +
      '<input type="text" value="' + l.n + '" onchange="blinds[' + i + '].n=this.value" placeholder="名称">' +
      '<div class="rest-chk"><input type="checkbox" title="标记为休息" ' + (l.r ? 'checked' : '') + ' onchange="blinds[' + i + '].r=this.checked;renderLevels()"></div>' +
      '<button class="del-btn" onclick="blinds.splice(' + i + ',1);renderLevels();buildRuntime();update()" ' + (blinds.length <= 1 ? 'disabled' : '') + '>×</button>' +
      '</div>';
  }
  document.getElementById('levelsList').innerHTML = html;
}

function addLevel() {
  var last = blinds[blinds.length - 1];
  blinds.push({ s: last.s * 2, b: last.b * 2, a: last.a * 2, n: String(blinds.length + 1), r: false });
  renderLevels();
}

function addRestLevel() {
  blinds.push({ s: 0, b: 0, a: 0, n: '休息', r: true });
  renderLevels();
}

/* ── 保存设置 ── */
function saveSettings() {
  readFormValues();
  localStorage.setItem('raiseTimer', JSON.stringify(cfg));
  localStorage.setItem('raiseBlinds', JSON.stringify(blinds));
  state.totalTime = cfg.dur * 60;
  state.timeLeft = state.totalTime;
  state.levelIdx = 0;
  state.elapsed = 0;
  state.running = false;
  clearInterval(interval);
  document.getElementById('startBtn').textContent = '▶ 开始';
  buildRuntime();
  update();
  toggleSettings();
}

/* ── 计时器控制 ── */
function toggleTimer() {
  if (state.running) {
    clearInterval(interval);
    state.running = false;
    document.getElementById('startBtn').textContent = '▶ 继续';
  } else {
    interval = setInterval(function() {
      state.timeLeft--;
      state.elapsed++;
      if (state.timeLeft === 60) {
        if (cfg.sound) beep(800, 0.15);
        speak('一分钟后升盲');
      }
      if (state.timeLeft === 30) {
        if (cfg.sound) beep(1000, 0.2);
        speak('三十秒后升盲');
      }
      if (state.timeLeft === cfg.warn && state.timeLeft !== 60 && state.timeLeft !== 30 && cfg.sound) beep(800, 0.2);
      if (state.timeLeft === cfg.danger && state.timeLeft !== 60 && state.timeLeft !== 30 && cfg.sound) beep(1000, 0.3);
      if (state.timeLeft <= 0) {
        if (cfg.sound) beep(600, 0.5);
        nextLevel();
      }
      update();
    }, 1000);
    state.running = true;
    document.getElementById('startBtn').textContent = '⏸ 暂停';
  }
}

function nextLevel() {
  if (state.levelIdx < runtimeBlinds.length - 1) {
    state.levelIdx++;
  }
  var lv = runtimeBlinds[state.levelIdx];
  // 休息轮可能有独立时长
  if (lv && lv._rest) {
    state.totalTime = (lv._restMin || cfg.restDuration) * 60;
  } else {
    state.totalTime = cfg.dur * 60;
  }
  state.timeLeft = state.totalTime;
  // 如果正在运行就不需要重置 running 状态
  if (!state.running) {
    document.getElementById('startBtn').textContent = '▶ 开始';
  }
  // 升盲闪光动画
  var flash = document.createElement('div');
  flash.className = 'level-flash';
  document.body.appendChild(flash);
  setTimeout(function(){ flash.remove(); }, 900);

  // TTS 升盲播报
  if (lv) {
    if (lv._rest) {
      speak('休息时间，' + (lv._restMin || cfg.restDuration) + '分钟');
    } else {
      var announcement = '盲注升级，第' + lv.n + '级，小盲' + lv.s + '，大盲' + lv.b;
      if (lv.a > 0) announcement += '，前注' + lv.a;
      speak(announcement);
    }
  }
  update();
}

function resetTimer() {
  clearInterval(interval);
  state.running = false;
  state.levelIdx = 0;
  state.elapsed = 0;
  var lv = runtimeBlinds[0];
  if (lv && lv._rest) {
    state.totalTime = (lv._restMin || cfg.restDuration) * 60;
  } else {
    state.totalTime = cfg.dur * 60;
  }
  state.timeLeft = state.totalTime;
  document.getElementById('startBtn').textContent = '▶ 开始';
  update();
}

/* ── 显示更新 ── */
function update() {
  if (runtimeBlinds.length === 0) buildRuntime();
  var lv = runtimeBlinds[state.levelIdx] || runtimeBlinds[0];
  var cardLabel = document.getElementById('blindCardLabel');
  var blindDisp = document.getElementById('blindDisplay');
  var anteDisp = document.getElementById('anteDisplay');
  var lvName = document.getElementById('levelName');

  if (lv._rest) {
    // 休息轮显示
    cardLabel.textContent = '休息时间';
    blindDisp.innerHTML = '<span class="rest-icon">☕</span>';
    anteDisp.textContent = '';
    lvName.innerHTML = '<span class="rest-label">REST BREAK</span>';
  } else {
    cardLabel.textContent = '当前盲级';
    blindDisp.innerHTML = lv.s + ' <span class="slash">/</span> ' + lv.b;
    if (lv.a > 0) {
      anteDisp.textContent = 'Ante ' + lv.a;
    } else {
      anteDisp.textContent = '';
    }
    lvName.textContent = '第 ' + lv.n + ' 级';
  }

  // 计时器
  var m = String(Math.floor(state.timeLeft / 60)).padStart(2, '0');
  var sec = String(state.timeLeft % 60).padStart(2, '0');
  var tEl = document.getElementById('timeDisplay');
  tEl.textContent = m + ':' + sec;

  var ring = document.getElementById('ringProgress');
  ring.classList.remove('warning', 'danger');
  tEl.classList.remove('warning', 'danger');
  if (state.timeLeft <= cfg.danger) {
    ring.classList.add('danger'); tEl.classList.add('danger');
  } else if (state.timeLeft <= cfg.warn) {
    ring.classList.add('warning'); tEl.classList.add('warning');
  }

  var pct = state.totalTime > 0 ? state.timeLeft / state.totalTime : 0;
  ring.setAttribute('stroke-dashoffset', 565.48 * (1 - pct));

  // 进度条
  var bar = document.getElementById('progressBar');
  var usedPct = state.totalTime > 0 ? ((state.totalTime - state.timeLeft) / state.totalTime * 100) : 0;
  bar.style.width = usedPct + '%';
  bar.classList.remove('warning', 'danger');
  if (state.timeLeft <= cfg.danger) {
    bar.classList.add('danger');
  } else if (state.timeLeft <= cfg.warn) {
    bar.classList.add('warning');
  }

  // 已用时间
  var em = String(Math.floor(state.elapsed / 60)).padStart(2, '0');
  var es = String(state.elapsed % 60).padStart(2, '0');
  document.getElementById('elapsed').textContent = em + ':' + es;

  // 级别索引
  document.getElementById('levelIndex').textContent = (state.levelIdx + 1) + ' / ' + runtimeBlinds.length;

  // 更新侧边栏
  renderSidebar();

  // 下一盲级
  var nIdx = state.levelIdx + 1;
  var nextEl = document.getElementById('nextBlind');
  if (nIdx < runtimeBlinds.length) {
    var nx = runtimeBlinds[nIdx];
    if (nx._rest) {
      nextEl.textContent = '☕ 休息 ' + (nx._restMin || cfg.restDuration) + '分钟';
    } else {
      var txt = nx.s + ' / ' + nx.b;
      if (nx.a > 0) txt += ' · Ante ' + nx.a;
      txt += ' · ' + nx.n;
      nextEl.textContent = txt;
    }
  } else {
    nextEl.textContent = '— 最后一级 —';
  }
}

/* ── 音效 ── */
function beep(freq, dur) {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq;
    g.gain.value = 0.3;
    o.start();
    o.stop(ctx.currentTime + dur);
  } catch(e) {}
}

/* ── TTS 语音播报 ── */
let _ttsVoice = null;
let _ttsVoiceReady = false;

function initTTSVoice() {
  var voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  _ttsVoiceReady = true;
  // 优先选中文女声
  var zhVoices = voices.filter(function(v) {
    return /zh|cmn|chinese/i.test(v.lang);
  });
  // 优先：名字含女性关键词的中文语音
  var femaleKeywords = /female|xiaoxiao|ting.ting|lili|yaoyao|hanhan|xiaoyan|woman|nü|女/i;
  var pick = zhVoices.find(function(v) { return femaleKeywords.test(v.name); });
  if (!pick) {
    // 其次：任意中文语音
    pick = zhVoices[0];
  }
  if (!pick) {
    // 兜底：任意语音
    pick = voices[0];
  }
  _ttsVoice = pick;
}

// 语音列表可能异步加载
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = initTTSVoice;
}
initTTSVoice();

function speak(text) {
  if (!cfg.tts) return;
  if (!('speechSynthesis' in window)) return;
  // 取消正在播放的语音，避免堆叠
  speechSynthesis.cancel();
  if (!_ttsVoiceReady) initTTSVoice();
  var msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'zh-CN';
  msg.rate = 0.85;   // 稍慢，温柔感
  msg.pitch = 1.15;  // 略高音调，偏柔和
  msg.volume = 1.0;
  if (_ttsVoice) msg.voice = _ttsVoice;
  speechSynthesis.speak(msg);
}

/* ── UI 切换 ── */
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

/* ── 键盘快捷键（去掉了左右方向键） ── */
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space')  { e.preventDefault(); toggleTimer(); }
  if (e.code === 'KeyR')   { e.preventDefault(); resetTimer(); }
  if (e.code === 'KeyF')   { e.preventDefault(); toggleFullscreen(); }
});

/* ── 侧边栏渲染 ── */
function renderSidebar() {
  var sb = document.getElementById('blindsSidebar');
  var html = '<div class="sidebar-title">盲注结构</div>';
  for (var i = 0; i < runtimeBlinds.length; i++) {
    var lv = runtimeBlinds[i];
    var cls = 'sidebar-level';
    if (i < state.levelIdx) cls += ' past';
    else if (i === state.levelIdx) cls += ' current';
    else cls += ' future';
    if (lv._rest) cls += ' rest-break';

    html += '<div class="' + cls + '" data-sidx="' + i + '">';
    html += '<span class="sl-idx">' + (i + 1) + '</span>';
    if (lv._rest) {
      html += '<span class="sl-rest-icon">☕</span>';
      html += '<span class="sl-blinds" style="color:var(--green)">休息 ' + (lv._restMin || cfg.restDuration) + 'min</span>';
    } else {
      html += '<span class="sl-blinds">' + lv.s + '/' + lv.b + '</span>';
      if (lv.a > 0) {
        html += '<span class="sl-ante">A' + lv.a + '</span>';
      }
    }
    html += '</div>';
  }
  sb.innerHTML = html;

  // 自动滚动到当前级别可见
  var currentEl = sb.querySelector('.sidebar-level.current');
  if (currentEl) {
    currentEl.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }
}

/* ── 初始化 ── */
load();
</script>
</body>
</html>
